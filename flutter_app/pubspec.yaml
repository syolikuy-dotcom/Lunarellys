name: lunarellys_music
description: Lunarellys — Modern Music Streaming App inspired by Metrolist, Auralis, and Spotify.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+4
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
